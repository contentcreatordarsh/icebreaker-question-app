name = "icebreaker-question-app"
main = "worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
# Run the Worker first for the root document so addSecurityHeaders() applies its
# CSP/HSTS/X-Frame-Options to index.html too. Without this, Workers Assets serves
# matching static files (e.g. "/" -> index.html) directly, bypassing the Worker —
# which left the most-visited page with NO security headers. SPA routes (/play,
# /privacy, …) already fall through to the Worker. Other static assets (hashed
# JS/CSS/icons) are still served directly from edge cache; CSP/HSTS only matter on
# the HTML document, which this covers.
run_worker_first = ["/", "/index.html"]

# Non-secret runtime vars
[vars]
FIREBASE_PROJECT_ID = "gen-lang-client-0170753836"
FIREBASE_DATABASE_ID = "ai-studio-ce545956-aa8d-4e12-9ad5-c58ab798d709"
# Stripe price IDs — not secret (visible in client JS anyway). DORMANT — kept in
# case a Singapore UEN is obtained later; the active provider is Lemon Squeezy.
STRIPE_MONTHLY_PRICE_ID = "price_1TbuoIGGeaVzeXJn6DUqMXnR"
STRIPE_YEARLY_PRICE_ID  = "price_1TbusLGGeaVzeXJnZSPNgkFU"
# Lemon Squeezy (active provider) — store + variant IDs are public (like price IDs).
# Replace these placeholders with the real IDs from the Lemon Squeezy dashboard.
LEMONSQUEEZY_STORE_ID = "REPLACE_WITH_STORE_ID"
LEMONSQUEEZY_MONTHLY_VARIANT_ID = "REPLACE_WITH_MONTHLY_VARIANT_ID"
LEMONSQUEEZY_YEARLY_VARIANT_ID = "REPLACE_WITH_YEARLY_VARIANT_ID"
# Email (Resend) — replace with a verified sender from your Resend domain.
# Uses onboarding@resend.dev (test-only) until RESEND_FROM is set.
RESEND_FROM = "Dinner Table Cards <onboarding@resend.dev>"

# Workers AI — powers "Surprise Me" on-demand question generation (free tier)
[ai]
binding = "AI"

# KV — stores Stripe customer → Firebase UID mapping, referral codes, token cache
[[kv_namespaces]]
binding = "APP_KV"
id = "82aa3336b53041068bf461968d0397c8"

# Durable Objects — live game sessions (Kahoot-style multiplayer)
[durable_objects]
bindings = [
  { name = "GAME_SESSIONS", class_name = "GameSession" }
]

[[migrations]]
tag = "v1"
new_classes = ["GameSession"]

# Observability — enable Worker logs in the Cloudflare dashboard
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# Cron — reset monthly usageCount for active subscribers on the 1st of each month
[triggers]
crons = ["0 0 1 * *"]

# Secrets (set via `wrangler secret put <NAME>` — never committed):
#   LEMONSQUEEZY_API_KEY       ← Settings → API in the Lemon Squeezy dashboard
#   LEMONSQUEEZY_WEBHOOK_SECRET ← the signing secret you set when creating the webhook
#   STRIPE_SECRET_KEY           (dormant)
#   STRIPE_WEBHOOK_SECRET       (dormant)
#   FIREBASE_SERVICE_ACCOUNT_EMAIL
#   FIREBASE_PRIVATE_KEY
#   RESEND_API_KEY  ← get from resend.com/api-keys (emails silently skipped until set)
#   SENTRY_DSN      ← optional error monitoring; unhandled worker errors reported when set
#
# Build-time VITE_ vars (set in .env locally or Cloudflare build environment):
#   VITE_LEMONSQUEEZY_MONTHLY_VARIANT_ID
#   VITE_LEMONSQUEEZY_YEARLY_VARIANT_ID
#   VITE_STRIPE_MONTHLY_PRICE_ID  (dormant)
#   VITE_STRIPE_YEARLY_PRICE_ID   (dormant)
