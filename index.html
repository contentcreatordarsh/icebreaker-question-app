<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary -->
    <title>Dinner Table Cards — Conversation Starters for Meaningful Moments</title>
    <meta name="description" content="Beautiful icebreaker and deep-talk question cards for dinner parties, team meetings, and meaningful conversations. Over 300 curated questions." />
    <meta name="theme-color" content="#5A5A40" />
    <!-- The app is light-only; declaring this avoids a dark-mode flash and the
         Lighthouse "does not have a <meta name=color-scheme>" hint. -->
    <meta name="color-scheme" content="light" />

    <!-- Canonical -->
    <link rel="canonical" href="https://dinnertablecards.xyz/" />

    <!-- Preconnect to Firebase/Google services for faster auth & data -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://apis.google.com" crossorigin />

    <!-- Favicon & PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DT Cards" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph / Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dinnertablecards.xyz/" />
    <meta property="og:title" content="Dinner Table Cards — Conversation Starters" />
    <meta property="og:description" content="Over 300 curated icebreaker and deep-talk questions for dinner parties, team meetings, and meaningful conversations." />
    <meta property="og:image" content="https://dinnertablecards.xyz/og-image.svg" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dinner Table Cards — Conversation Starters" />
    <meta name="twitter:description" content="Beautiful question cards for meaningful conversations. Icebreakers, deep talk, team building — curated &amp; ready." />
    <meta name="twitter:image" content="https://dinnertablecards.xyz/og-image.svg" />

    <!-- JSON-LD structured data: WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Dinner Table Cards",
      "description": "Curated conversation starter cards for dinner parties, team meetings, and meaningful dialogue.",
      "url": "https://dinnertablecards.xyz/",
      "applicationCategory": "LifestyleApplication",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <!-- JSON-LD structured data: FAQ (enables rich snippets in Google search) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What happens when I hit 25 free questions?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You'll see an upgrade prompt. There's no expiry — your saved favorites stay yours forever."
          }
        },
        {
          "@type": "Question",
          "name": "Can I cancel my subscription anytime?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Two clicks from your account page. No dark patterns, no retention flow, no guilt."
          }
        },
        {
          "@type": "Question",
          "name": "What's the difference between Light and Deep questions?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Light questions are playful and low-stakes — great for groups still warming up. Deep questions go further: values, regrets, hopes. Both are in every category."
          }
        },
        {
          "@type": "Question",
          "name": "Will I see the same questions twice?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Occasionally — the archive has 600+ questions, but popular categories cycle. Premium unlocks the full depth so repeats are rare."
          }
        },
        {
          "@type": "Question",
          "name": "Does it work without internet?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Once the app loads, it works offline. Questions are cached in your browser automatically — no internet needed mid-dinner."
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Cloudflare Web Analytics: active via "Automatic setup" (injected at edge). -->
  </body>
</html>
